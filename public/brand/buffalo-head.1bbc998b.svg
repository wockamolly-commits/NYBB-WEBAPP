<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 23 464 334" width="464" height="334" role="img" aria-label="Buffalo head">
  <!--
    The buffalo, drawn rather than recovered.

    The mark this replaces was a detailed 19th century engraving pulled out of a
    JPEG screenshot by stretching the blue channel. Three things were wrong with
    it. It came out as a photographic negative, so the fur strokes read as
    highlights and the whole thing looked like an x-ray. It carried thousands of
    individual strokes, which at watermark opacity collapse into a smudge rather
    than a shape. And it was white, so on the amber ground it desaturated a soft
    blob of the gradient instead of sitting inside it.

    This is the opposite on all three counts: one bold silhouette, no interior
    texture, and a dark warm brown so it reads as an emboss pressed into the
    ground rather than a film laid over it.

    Everything is the left half mirrored about x=240, so the mark is exactly
    symmetrical by construction rather than by eye.

    The tufted crown is the load-bearing detail. A smooth dome plus horns reads
    as a bull; the shaggy forehead is what makes it a bison, so it is drawn into
    the outline where it survives at 9% opacity, not added as interior linework
    that would disappear.

    #3b1c05 is not a new colour. It is the page gradient's own hue taken down to
    near black, which is why it darkens the amber without cooling or greying it.
  -->
  <defs>
    <mask id="buffalo">
      <rect x="8" y="23" width="464" height="334" fill="black" />
      <g fill="white">
        <path d="M 240 26 C 224 24 214 40 196 44 C 172 32 148 48 138 78 C 112 84 94 114 90 152 C 86 188 98 216 116 240 C 132 260 148 270 160 284 C 170 296 176 310 180 324 C 184 340 200 350 218 353 C 226 354 233 355 240 355 L 240 26 Z" />
        <g transform="translate(480,0) scale(-1,1)">
          <path d="M 240 26 C 224 24 214 40 196 44 C 172 32 148 48 138 78 C 112 84 94 114 90 152 C 86 188 98 216 116 240 C 132 260 148 270 160 284 C 170 296 176 310 180 324 C 184 340 200 350 218 353 C 226 354 233 355 240 355 L 240 26 Z" />
        </g>
        <path d="M 104 218 C 72 238 34 230 20 200 C 8 172 8 138 14 110 C 26 138 32 168 42 184 C 58 208 84 204 98 152 Z" />
        <g transform="translate(480,0) scale(-1,1)">
          <path d="M 104 218 C 72 238 34 230 20 200 C 8 172 8 138 14 110 C 26 138 32 168 42 184 C 58 208 84 204 98 152 Z" />
        </g>
      </g>
      <g fill="black">
        <ellipse cx="130" cy="220" rx="16" ry="10" transform="rotate(-18 130 220)" />
        <ellipse cx="350" cy="220" rx="16" ry="10" transform="rotate(18 350 220)" />
        <ellipse cx="216" cy="320" rx="13" ry="9" transform="rotate(-20 216 320)" />
        <ellipse cx="264" cy="320" rx="13" ry="9" transform="rotate(20 264 320)" />
      </g>
    </mask>
  </defs>
  <rect x="8" y="23" width="464" height="334" fill="#3b1c05" mask="url(#buffalo)" />
</svg>
