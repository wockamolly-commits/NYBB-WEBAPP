<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your NYBB sign-in code</title>
  </head>
  <body style="margin:0;background:#0b0b0c;color:#f5f1ea;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width:520px;background:#17181a;border:1px solid #3d3f42;border-radius:8px"
          >
            <tr>
              <td style="padding:32px">
                <p style="margin:0 0 12px;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#f47621">
                  New York Buffalo Brad's
                </p>
                <h1 style="margin:0;font-size:30px;line-height:1.1;color:#f5f1ea">
                  Your sign-in code
                </h1>
                <p style="margin:18px 0;color:#c5c1bb;font-size:16px;line-height:1.5">
                  Enter this six-digit code on the sign-in screen. It expires after ten minutes.
                </p>
                <p
                  style="margin:24px 0;padding:18px;background:#232528;border-radius:6px;text-align:center;font-family:Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:0.28em;color:#f9ee18"
                >
                  {{ .Token }}
                </p>
                <p style="margin:18px 0 0;color:#8f8c87;font-size:13px;line-height:1.5">
                  If you did not request this code, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
